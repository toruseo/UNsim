name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:  
  schedule:
    - cron: '0 6 * * 1'


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - test_api.py
          - test_checkpoint.py
          - test_deltat.py
          - test_diff.py
          - test_duo.py
          - test_route_bias.py
          - test_travel_time_soft.py
          - test_verification_node.py
          - test_verification_straight_road.py
          - test_visualization.py

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib pillow pytest jax[cpu]

      - name: Run ${{ matrix.test-file }}
        run: python -m pytest "tests/${{ matrix.test-file }}" -v
